<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Query Assistant - Medinsight AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <img class="logo" src="assets/medinsight ai logo nobg 1.png" alt="Medinsight AI Logo">

    <div class="profile-wrapper">
        <img class="dp" src="assets/account 1.png" alt="Profile" id="profileBtn">

        <div class="profile-popup" id="profilePopup">
            <p class="profile-name">Anagha</p>
            <p class="profile-username">@anagha_k</p>
            <button class="add-patient-btn">Add Patient</button>
        </div>
    </div>
</header>

<section class="chat-section">
    <h1 class="page-title">AI Health Query Assistant</h1>
    <p class="page-subtitle">Ask health questions and get clear, non-diagnostic answers instantly</p>

    <div class="suggestions">
    <button onclick="sendMessage('What is fever?')">Fever</button>
    <button onclick="sendMessage('Symptoms of dengue')">Dengue</button>
    <button onclick="sendMessage('Normal blood pressure range')">Blood Pressure</button>
    <button onclick="sendMessage('What causes headache?')">Headache</button>
    </div>


    <div class="chat-container">

        <div class="chat-messages" id="chatMessages">
            <div class="chat-placeholder">
                <p>Ask a health question to understand reports, tests, or symptoms</p>
            </div>
        </div>

        <div class="chat-input-wrapper">
            <input type="text" class="chat-input" id="chatInput" placeholder="Ask anything">
            <button class="chat-send-btn" id="sendBtn">Send</button>
        </div>

    </div>
</section>

<footer>
    <div class="page-links">
        <a href="#">About us</a>
        <a href="#">Ethical and Medical Disclaimer</a>
        <a href="#">Terms and Conditions</a>
        <a href="#">Contact / Support</a>
    </div>
</footer>

<script>
const profileBtn = document.getElementById("profileBtn");
const profilePopup = document.getElementById("profilePopup");

profileBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    profilePopup.classList.toggle("show");
});

document.addEventListener("click", () => {
    profilePopup.classList.remove("show");
});

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('chatInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
});

function formatResponse(text) {
    return text
        .replace(/\*\*\s*(.*?)\s*\*\*/g, "<b>$1</b>")
        .replace(/(\d+\.)/g, "<br><br>$1")
        .replace(/\n/g, "<br>");
}

function typeText(element, html, speed = 10) {
    let i = 0;
    const text = html.replace(/<[^>]*>/g, ""); // strip tags for typing
    element.innerHTML = "";

    function type() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(type, speed);
        } else {
            element.innerHTML = html; // restore formatting
        }
    }

    type();
}


function sendMessage(messageFromChip = null) {
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const message = messageFromChip || input.value.trim();

    if (!message) return;

    const chatMessages = document.getElementById('chatMessages');
    chatMessages.querySelector('.chat-placeholder')?.remove();

    const userMsg = document.createElement('div');
    userMsg.className = 'chat-message user';
    userMsg.textContent = message;
    chatMessages.appendChild(userMsg);

    input.value = '';
    chatMessages.scrollTop = chatMessages.scrollHeight;

    sendBtn.disabled = true;
    sendBtn.textContent = "Thinking...";

    const aiMsg = document.createElement('div');
    aiMsg.className = 'chat-message ai';
    aiMsg.textContent = "Typing...";
    chatMessages.appendChild(aiMsg);

    fetch("/get", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "msg=" + encodeURIComponent(message)
    })
    .then(response => response.text())
    .then(data => {
        const formatted = formatResponse(data);

        typeText(aiMsg, formatted, 8);

        const copyBtn = document.createElement("button");
        copyBtn.textContent = "Copy";
        copyBtn.className = "copy-btn";
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(data);
            copyBtn.textContent = "Copied!";
            setTimeout(() => copyBtn.textContent = "Copy", 1500);
        };

        aiMsg.appendChild(document.createElement("br"));
        aiMsg.appendChild(copyBtn);

        chatMessages.scrollTop = chatMessages.scrollHeight;
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
    })
    .catch(error => {
        aiMsg.textContent = "Error connecting to AI server.";
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
    });
}
</script>

</body>
</html>
