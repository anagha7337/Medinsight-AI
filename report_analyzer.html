<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Report Analyzer - Medinsight AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@200..800&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <img class="logo" src="assets/medinsight ai logo nobg 1.png" alt="Medinsight AI Logo">
</header>

<section class="analyzer-section">
    <h1 class="page-title">Medical Report Analyzer</h1>
    <p class="page-subtitle">Turn complex medical reports into simple, understandable insights.</p>

    <div class="analyzer-container">

        <!-- Upload -->
        <div class="upload-area" onclick="document.getElementById('reportFile').click()">
            <img src="assets/medical_report_icon.png" class="upload-icon">
            <p class="upload-text">Upload medical report (jpg / pdf)</p>
            <input type="file" id="reportFile" accept=".jpg,.jpeg,.pdf" hidden>
        </div>

        <div class="form-row">
            <select class="form-select">
                <option value="">Select Language</option>
                <option value="english">English</option>
                <option value="hindi">Hindi</option>
                <option value="malayalam">Malayalam</option>
            </select>
            
            <select class="form-select">
                <option value="">Select Patient</option>
                <option value="patient1">Patient 1</option>
                <option value="patient2">Patient 2</option>
            </select>
        </div>
        
        <label class="checkbox-label">
            <input type="checkbox">
            I agree that this report may be used for trend tracking and health history analysis.
        </label>

        <div class="upload-btn-row">
            <button class="upload-btn" id="uploadBtn" disabled>Upload</button>
        </div>

        <!-- RESULTS -->
        <div class="result-box" id="resultBox" style="display:none;">

            <h3>Abnormal Findings</h3>
            <div id="abnormalList"></div>

            <h3 style="margin-top:20px;">What does this mean?</h3>
            <p id="aiExplanation" class="ai-explanation"></p>

        </div>

    </div>
</section>

<footer>
    <p class="copyright">
        Built for educational and research purposes only
    </p>
</footer>

<script>
let selectedFile = null;

const fileInput = document.getElementById("reportFile");
const uploadBtn = document.getElementById("uploadBtn");
const uploadText = document.querySelector(".upload-text");

fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files[0];
    uploadText.textContent = "Selected: " + selectedFile.name;
    uploadBtn.disabled = false;
});

uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    uploadText.textContent = "Analyzing...";
    uploadBtn.disabled = true;

    const resultBox = document.getElementById("resultBox");
    const abnormalList = document.getElementById("abnormalList");
    const aiExplanation = document.getElementById("aiExplanation");

    try {
        const formData = new FormData();
        formData.append("file", selectedFile);

        const response = await fetch("http://127.0.0.1:5000/upload-report", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        const result = await response.json();

        resultBox.style.display = "block";
        abnormalList.innerHTML = "";
        aiExplanation.textContent = "";

        const abnormalValues = result.abnormal_values || {};

        // ✅ Case: No abnormalities
        if (Object.keys(abnormalValues).length === 0) {
            abnormalList.innerHTML =
                "<p>All values are within the normal range 🎉</p>";
            aiExplanation.textContent =
                "No follow-up action required at this time.";
            return;
        }

        // ✅ Render abnormal values
        for (const test in abnormalValues) {
            const item = abnormalValues[test];

            const div = document.createElement("div");
            div.className = "abnormal-item";
            div.innerHTML = `
                <strong>${test}</strong><br>
                Value: ${item.value}<br>
                Status: <span class="${item.status.toLowerCase()}">${item.status}</span><br>
                Normal Range: ${item.normal_range}
            `;

            abnormalList.appendChild(div);
        }

        // ✅ Combine AI explanations
        let combinedExplanation = "";
        let modelWarming = false;

        for (const test in abnormalValues) {
            const explanation = abnormalValues[test].explanation || "";

            if (explanation.toLowerCase().includes("warming up")) {
                modelWarming = true;
            }

            combinedExplanation += `• ${test}: ${explanation}\n\n`;
        }

        if (modelWarming) {
            combinedExplanation +=
                "\n⏳ AI model is waking up. Please click Upload again in about a minute for detailed explanations.";
        }

        aiExplanation.textContent = combinedExplanation.trim();

    } catch (error) {
        console.error(error);
        alert("Something went wrong while analyzing the report. Please try again.");
    } finally {
        // 🔥 ALWAYS reset UI
        uploadBtn.disabled = false;
        uploadText.textContent = "Upload medical report (jpg / pdf)";
        selectedFile = null;
        fileInput.value = "";
    }
});

</script>

</body>
</html>
