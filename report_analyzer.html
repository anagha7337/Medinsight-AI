<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Report Analyzer - Medinsight AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@200..800&display=swap" rel="stylesheet">
    
    <style>
        /* Additional styles for better presentation */
        .abnormal-item {
            background: #f8f9fa;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        
        .abnormal-item.low {
            border-left-color: #0dcaf0;
        }
        
        .abnormal-item.high {
            border-left-color: #dc3545;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-badge.low {
            background: #cff4fc;
            color: #055160;
        }
        
        .status-badge.high {
            background: #f8d7da;
            color: #842029;
        }
        
        .ai-explanation {
            background: #e7f3ff;
            border-left: 4px solid #0066cc;
            padding: 20px;
            border-radius: 5px;
            line-height: 1.8;
            margin-top: 15px;
            white-space: pre-wrap;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0066cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success-message {
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            text-align: center;
        }
        
        .test-value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .test-name {
            font-size: 16px;
            font-weight: 600;
            color: #0066cc;
            margin-bottom: 8px;
        }
        
        .normal-range {
            color: #666;
            font-size: 14px;
        }

        .language-badge {
            display: inline-block;
            background: #0066cc;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<header>
    <img class="logo" src="assets/medinsight ai logo nobg 1.png" alt="Medinsight AI Logo">
</header>

<section class="analyzer-section">
    <h1 class="page-title">Medical Report Analyzer</h1>
    <p class="page-subtitle">Turn complex medical reports into simple, understandable insights.</p>

    <div class="analyzer-container">

        <!-- Upload Area -->
        <div class="upload-area" onclick="document.getElementById('reportFile').click()">
            <img src="assets/medical_report_icon.png" class="upload-icon" alt="Upload icon">
            <p class="upload-text">Upload medical report (jpg / pdf)</p>
            <input type="file" id="reportFile" accept=".jpg,.jpeg,.pdf" hidden>
        </div>

        <div class="form-row">
            <select class="form-select" id="languageSelect">
                <option value="english">English</option>
                <option value="hindi">हिंदी (Hindi)</option>
                <option value="bengali">বাংলা (Bengali)</option>
                <option value="telugu">తెలుగు (Telugu)</option>
                <option value="marathi">मराठी (Marathi)</option>
                <option value="tamil">தமிழ் (Tamil)</option>
                <option value="urdu">اردو (Urdu)</option>
                <option value="gujarati">ગુજરાતી (Gujarati)</option>
                <option value="kannada">ಕನ್ನಡ (Kannada)</option>
                <option value="malayalam">മലയാളം (Malayalam)</option>
                <option value="odia">ଓଡ଼ିଆ (Odia)</option>
            </select>
            
            <select class="form-select">
                <option value="">Select Patient</option>
                <option value="patient1">Patient 1</option>
                <option value="patient2">Patient 2</option>
            </select>
        </div>
        
        <label class="checkbox-label">
            <input type="checkbox">
            I agree that this report may be used for trend tracking and health history analysis.
        </label>

        <div class="upload-btn-row">
            <button class="upload-btn" id="uploadBtn" disabled>Upload & Analyze</button>
        </div>

        <!-- RESULTS SECTION -->
        <div class="result-box" id="resultBox" style="display:none;">

            <div id="languageBadge" class="language-badge"></div>

            <h3>📋 Your Test Results</h3>
            <div id="abnormalList"></div>

            <h3 style="margin-top:30px;">💡 What This Means For You</h3>
            <div id="aiExplanation"></div>

        </div>

    </div>
</section>

<footer>
    <p class="copyright">
        2026 Medinsight AI | Built for educational and research purposes only
    </p>
</footer>

<script>
let selectedFile = null;

const fileInput = document.getElementById("reportFile");
const uploadBtn = document.getElementById("uploadBtn");
const uploadText = document.querySelector(".upload-text");
const languageSelect = document.getElementById("languageSelect");

// File selection handler
fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files[0];
    if (selectedFile) {
        uploadText.textContent = "✓ Selected: " + selectedFile.name;
        uploadBtn.disabled = false;
    }
});

// Upload and analyze handler
uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    // Get selected language
    const selectedLanguage = languageSelect.value;

    // Show loading state
    const originalText = uploadText.textContent;
    uploadText.innerHTML = '<span class="loading-spinner"></span>Analyzing your report...';
    uploadBtn.disabled = true;
    uploadBtn.textContent = "Analyzing...";

    const resultBox = document.getElementById("resultBox");
    const abnormalList = document.getElementById("abnormalList");
    const aiExplanation = document.getElementById("aiExplanation");
    const languageBadge = document.getElementById("languageBadge");

    try {
        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("language", selectedLanguage);  // Send selected language

        const response = await fetch("http://127.0.0.1:5000/upload-report", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("Server error. Please try again.");
        }

        const result = await response.json();

        // Show results
        resultBox.style.display = "block";
        abnormalList.innerHTML = "";
        aiExplanation.innerHTML = "";

        // Display language badge
        const languageNames = {
            "english": "🇬🇧 English",
            "hindi": "🇮🇳 हिंदी",
            "bengali": "🇮🇳 বাংলা",
            "telugu": "🇮🇳 తెలుగు",
            "marathi": "🇮🇳 मराठी",
            "tamil": "🇮🇳 தமிழ்",
            "urdu": "🇵🇰 اردو",
            "gujarati": "🇮🇳 ગુજરાતી",
            "kannada": "🇮🇳 ಕನ್ನಡ",
            "malayalam": "🇮🇳 മലയാളം",
            "odia": "🇮🇳 ଓଡ଼ିଆ"
        };
        languageBadge.textContent = `Explanations in: ${languageNames[selectedLanguage] || "English"}`;

        const abnormalValues = result.abnormal_values || {};

        // ✅ Case 1: No abnormalities found
        if (Object.keys(abnormalValues).length === 0) {
            const successMessages = {
                "english": {
                    title: "🎉 Great News!",
                    message: "All your test values are within the normal range.",
                    note: "No follow-up action required at this time."
                },
                "hindi": {
                    title: "🎉 Bahut Badhiya!",
                    message: "Aapki saari test values normal range mein hain.",
                    note: "Is samay koi follow-up action ki zaroorat nahi hai."
                },
                "malayalam": {
                    title: "🎉 Valare Nannayi!",
                    message: "Ningalude ellaa test values-um normal range-il aanu.",
                    note: "Ippol follow-up action aavashyamilla."
                },
                "tamil": {
                    title: "🎉 Romba Nannaagi!",
                    message: "Ungal ellaa test values-um normal range-il ullana.",
                    note: "Ippodhu follow-up action thevai illa."
                },
                "telugu": {
                    title: "🎉 Chaala Baagundi!",
                    message: "Mee anni test values normal range lo unnayi.",
                    note: "Ippudu follow-up action avasaram ledu."
                },
                "kannada": {
                    title: "🎉 Thumba Chennagi!",
                    message: "Nimma ellaa test values normal range alli ide.",
                    note: "Eega follow-up action aavashyaka illa."
                },
                "marathi": {
                    title: "🎉 Khup Chhan!",
                    message: "Tumchya sarvaa test values normal range madhe ahet.",
                    note: "Aata follow-up action aavashyak naahi."
                },
                "bengali": {
                    title: "🎉 Khub Bhalo!",
                    message: "Apnar shob test values normal range-e achhe.",
                    note: "Ekhon follow-up action proyojon nei."
                },
                "gujarati": {
                    title: "🎉 Khub Saras!",
                    message: "Tamara badha test values normal range ma chhe.",
                    note: "Atyare follow-up action jarur nathi."
                },
                "urdu": {
                    title: "🎉 Bahut Achha!",
                    message: "Aap ki tamaam test values normal range mein hain.",
                    note: "Is waqt follow-up action ki zaroorat nahi hai."
                },
                "odia": {
                    title: "🎉 Bahut Bhala!",
                    message: "Apananka sabu test values normal range re achhi.",
                    note: "Ebekaare follow-up action darkar nahin."
                }
            };

            const msg = successMessages[selectedLanguage] || successMessages["english"];

            abnormalList.innerHTML = `
                <div class="success-message">
                    <h3>${msg.title}</h3>
                    <p>${msg.message}</p>
                    <p style="margin-top: 10px; font-size: 14px;">${msg.note}</p>
                </div>
            `;
            uploadText.textContent = "✓ Analysis complete - All normal!";
            return;
        }

        // ✅ Case 2: Abnormalities found
        uploadText.textContent = `✓ Analysis complete - ${Object.keys(abnormalValues).length} value(s) need attention`;

        // Render each abnormal value
        for (const test in abnormalValues) {
            const item = abnormalValues[test];
            const statusClass = item.status.toLowerCase();

            const div = document.createElement("div");
            div.className = `abnormal-item ${statusClass}`;
            div.innerHTML = `
                <div class="test-name">${test}</div>
                <div class="test-value">Your Value: ${item.value}</div>
                <div class="normal-range">Normal Range: ${item.normal_range}</div>
                <span class="status-badge ${statusClass}">${item.status}</span>
            `;

            abnormalList.appendChild(div);
        }

        // Render AI explanations
        for (const test in abnormalValues) {
            const item = abnormalValues[test];
            const explanation = item.explanation || "Explanation not available.";

            const explainDiv = document.createElement("div");
            explainDiv.className = "ai-explanation";
            explainDiv.innerHTML = `
                <strong>📊 ${test}:</strong><br><br>
                ${explanation}
            `;

            aiExplanation.appendChild(explainDiv);
        }

        // Scroll to results
        resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    } catch (error) {
        console.error("Error:", error);
        
        const errorMessages = {
            "english": "⚠️ Something went wrong while analyzing the report. Please try again.",
            "hindi": "⚠️ Report analyze karte waqt kuch galat ho gaya. Kripya dobara try karein.",
            "malayalam": "⚠️ Report analyze cheyyumpol entho prashnam undaayi. Dayavayi veendum try cheyyuka.",
            "tamil": "⚠️ Report analyze seyyum podhu sila piracchanai vandhadhu. Dayavu seidhu marupadi muyarchi seyyungal.",
            "telugu": "⚠️ Report analyze chesthappudu konni samasyalu vachayi. Dayachesi maalli prayatninchandi.",
            "kannada": "⚠️ Report analyze maaduvaga kashta aayithu. Dayavittu mathe prayatnisi.",
            "marathi": "⚠️ Report analyze kartana kahi chukla. Krupaya punha prayatna kara.",
            "bengali": "⚠️ Report analyze korte giye kichhu bhul hoyeche. Doya kore abar chesta korun.",
            "gujarati": "⚠️ Report analyze karata samaye kuch bhul thai gayu. Krupa karine fari prayatna karo.",
            "urdu": "⚠️ Report analyze karte waqt kuch galat ho gaya. Barah-e-karam dobara koshish karein.",
            "odia": "⚠️ Report analyze kariba samaya kichhi bhul heigala. Dayakari punah prayasa karanta."
        };
        
        alert(errorMessages[selectedLanguage] || errorMessages["english"]);
        uploadText.textContent = "❌ Analysis failed - Please try again";
    } finally {
        // Reset button
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload & Analyze";
        
        // Reset file input for next upload
        selectedFile = null;
        fileInput.value = "";
    }
});

</script>

</body>
</html>
